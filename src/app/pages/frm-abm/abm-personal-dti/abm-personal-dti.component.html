<div class="container my-5">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
    <!-- CABECERA -->
    <div
      class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3"
    >
      <h4 class="m-0">
        <i class="bi bi-person-badge-fill me-2"></i>
        {{ editando ? "Editar Personal DTI" : "Nuevo Personal DTI" }}
      </h4>
    </div>

    <!-- =====================================================
         BUSCADOR DE PERSONAL
         Solamente se muestra cuando estamos dando de ALTA
    ====================================================== -->
    <div class="card-body pb-0" *ngIf="!editando">
      <div class="row">
        <div class="col-md-12">
          <app-fil-busqueda-solicitante
            (filter)="doFound($event)"
          ></app-fil-busqueda-solicitante>
        </div>
      </div>

      <hr class="mb-0" />
    </div>

    <!-- =====================================================
         FORMULARIO
    ====================================================== -->
    <div class="card-body bg-light">
      <form (ngSubmit)="guardar()" #formPersonal="ngForm" class="row g-3">
        <!-- ==============================
             DATOS PERSONALES
        =============================== -->

        <div class="col-12">
          <h6 class="fw-bold text-primary">
            <i class="bi bi-person-fill me-2"></i>
            Datos personales
          </h6>
        </div>

        <!-- NOMBRE -->
        <div class="col-md-6">
          <label class="form-label fw-semibold"> Nombre </label>

          <input
            readonly
            type="text"
            class="form-control"
            [(ngModel)]="item.nombre"
            name="nombre"
            required
          />
        </div>

        <!-- APELLIDO -->
        <div class="col-md-6">
          <label class="form-label fw-semibold"> Apellido </label>

          <input
            readonly
            type="text"
            class="form-control"
            [(ngModel)]="item.apellido"
            name="apellido"
            required
          />
        </div>

        <!-- DNI -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> DNI </label>

          <input
            readonly
            type="number"
            class="form-control"
            [(ngModel)]="item.dni"
            name="dni"
            required
          />
        </div>

        <!-- JERARQUÍA -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> Jerarquía </label>

          <input
            readonly
            type="text"
            class="form-control"
            [(ngModel)]="item.jerarquia"
            name="jerarquia"
          />
        </div>

        <!-- NRO CREDENCIAL -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> Nro. Credencial </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.nroCred"
            name="nroCred"
          />
        </div>

        <!-- FECHA NACIMIENTO -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> Fecha nacimiento </label>

          <input
            type="date"
            class="form-control"
            [(ngModel)]="item.fechaNacimiento"
            name="fechaNacimiento"
          />
        </div>

        <!-- PLAZA -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> Plaza </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.plaza"
            name="plaza"
          />
        </div>

        <!-- LEGAJO -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> Legajo </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.legajo"
            name="legajo"
          />
        </div>

        <!-- FECHA ALTA UNIDAD -->
        <div class="col-md-6">
          <label class="form-label fw-semibold"> Fecha alta en unidad </label>

          <input
            type="date"
            class="form-control"
            [(ngModel)]="item.fechaAltaUnidad"
            name="fechaAltaUnidad"
          />
        </div>

        <!-- FECHA INGRESO POLICÍA -->
        <div class="col-md-6">
          <label class="form-label fw-semibold"> Fecha ingreso Policía </label>

          <input
            type="date"
            class="form-control"
            [(ngModel)]="item.fechaIngresoPol"
            name="fechaIngresoPol"
          />
        </div>

        <!-- ==============================
             ARMAMENTO
        =============================== -->

        <div class="col-12 mt-4">
          <hr />

          <h6 class="fw-bold text-primary">
            <i class="bi bi-shield-fill me-2"></i>
            Armamento
          </h6>
        </div>

        <!-- ARMAMENTO -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> Armamento </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.armamento"
            name="armamento"
          />
        </div>

        <!-- CALIBRE -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> Calibre </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.calibre"
            name="calibre"
          />
        </div>

        <!-- NRO SERIE -->
        <div class="col-md-4">
          <label class="form-label fw-semibold"> Nro. Serie </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.nroSerie"
            name="nroSerie"
          />
        </div>

        <!-- ==============================
             DATOS ADICIONALES
        =============================== -->

        <div class="col-12 mt-4">
          <hr />

          <h6 class="fw-bold text-primary">
            <i class="bi bi-info-circle-fill me-2"></i>
            Datos adicionales
          </h6>
        </div>

        <!-- INSTRUMENTO LEGAL -->
        <div class="col-md-6">
          <label class="form-label fw-semibold"> Instrumento Legal </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.instrumentoLegal"
            name="instrumentoLegal"
          />
        </div>

        <!-- TELÉFONO -->
        <div class="col-md-6">
          <label class="form-label fw-semibold"> Teléfono Celular </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.telefonoCel"
            name="telefonoCel"
          />
        </div>

        <!-- DOMICILIO -->
        <div class="col-md-12">
          <label class="form-label fw-semibold"> Domicilio </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="item.domicilio"
            name="domicilio"
          />
        </div>

        <!-- ==============================
             BOTONES
        =============================== -->

        <div class="col-12 text-end mt-4">
          <button
            type="submit"
            class="btn btn-success me-2 px-4"
            [disabled]="!formPersonal.valid"
          >
            <i class="bi bi-save me-2"></i>

            {{ editando ? "Actualizar" : "Guardar" }}
          </button>

          <button type="button" class="btn btn-secondary px-4" (click)="back()">
            <i class="bi bi-x-circle me-2"></i>

            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
